<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - StudyPlanner Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#10b981',
                        warning: '#f59e0b',
                        danger: '#ef4444',
                        pink: '#ec4899'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50">
    <nav class="bg-white shadow-md fixed w-full z-10 top-0">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-book-open text-primary text-2xl"></i>
                <h1 class="text-xl font-bold text-primary">StudyPlanner Pro</h1>
            </div>
            <div class="hidden md:flex space-x-6">
                <a href="/" class="text-gray-700 hover:text-primary font-medium">Home</a>
                <a href="/login" class="text-primary font-medium">Login</a>
                <a href="/register" class="text-gray-700 hover:text-primary font-medium">Register</a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 pt-24 pb-16">
        <div class="max-w-md mx-auto bg-white rounded-xl shadow-lg p-6">
            <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
                <i class="fa-solid fa-right-to-bracket text-pink mr-2"></i>Login
            </h2>
            
            {% if error %}
            <div class="bg-danger/10 text-danger p-3 rounded mb-4">
                {{ error }}
            </div>
            {% endif %}
            
            <form action="/login" method="POST" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Username <span class="text-danger">*</span></label>
                    <input type="text" name="username" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-pink">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password <span class="text-danger">*</span></label>
                    <input type="password" name="password" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-pink">
                </div>
                <button type="submit" class="w-full bg-pink text-white px-4 py-2 rounded hover:bg-pink/90 transition-colors">
                    Login
                </button>
            </form>
            
            <div class="mt-4 text-center">
                <p class="text-gray-600">Don't have an account? <a href="/register" class="text-pink font-medium">Register now</a></p>
            </div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
